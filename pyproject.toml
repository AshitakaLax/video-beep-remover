[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-beep-remover"
dynamic = ["version"]
description = "Mute a configurable list of words in video files, using Whisper speech recognition and FFmpeg."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Levi Balling" }]
requires-python = ">=3.11"
keywords = ["profanity", "censor", "mute", "video", "subtitles", "whisper", "ffmpeg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Editors",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "charset-normalizer>=3",
  "faster-whisper>=1.1",
  "guessit>=3.4",
  "httpx>=0.25",
  "numpy>=1.24",
  "platformdirs>=4",
  "pydantic>=2.6",
  "pysubs2>=1.6",
  "rapidfuzz>=3",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
# cuBLAS for CUDA 12 and cuDNN 9, which faster-whisper needs on NVIDIA GPUs; vbr loads them itself
gpu = ["nvidia-cublas-cu12; sys_platform == 'linux'", "nvidia-cudnn-cu12==9.*; sys_platform == 'linux'"]
align = ["whisperx>=3.8.1"]  # transcription.backend = "whisperx": forced alignment, with PyTorch
context = ["torch>=2.2", "transformers>=4.56"]  # context analysis (DESIGN.md §17): local classifier and judge
# voice replacement (DESIGN.md §16): F5-TTS (its weights are CC BY-NC 4.0), Demucs and SpeechBrain.
# F5-TTS is held to the release tested: voice/models.py uses its internals (ema_model, sample).
voice = ["torch>=2.2", "torchaudio>=2.2", "f5-tts>=1.1,<1.2", "demucs>=4.0", "speechbrain>=1.0"]
sync = ["ffsubsync>=0.4.25"]  # re-times subtitles that fail the sync check
dev = [
  "hypothesis>=6",
  "mypy>=2.3,<2.4",  # the checkers are held to one release: a new one can fail code that passed
  "pytest>=8",
  "respx>=0.20",
  "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/AshitakaLax/video-beep-remover"
Documentation = "https://github.com/AshitakaLax/video-beep-remover#readme"
Design = "https://github.com/AshitakaLax/video-beep-remover/blob/main/docs/DESIGN.md"
Changelog = "https://github.com/AshitakaLax/video-beep-remover/blob/main/CHANGELOG.md"
Issues = "https://github.com/AshitakaLax/video-beep-remover/issues"

[project.scripts]
vbr = "video_beep_remover.cli:main"
video-beep-remover = "video_beep_remover.cli:main"

[tool.hatch.version]
path = "src/video_beep_remover/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/video_beep_remover"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "ffmpeg: needs ffmpeg and ffprobe on PATH (skipped when missing)",
  "asr: downloads and runs a Whisper model (opt-in with VBR_RUN_ASR_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic characters (–, →, ×) in strings and comments are intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # expected FFmpeg command lines are long

[tool.ruff.format]
exclude = ["*.md"]  # the code in the docs is compact on purpose (DESIGN.md §5.3)

# mypy checks for the Python it runs on: 3.11, the oldest supported, in CI's lint job. Telling it 3.11
# on a newer Python fails, since numpy's stubs there use syntax that 3.11 lacks.
[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Imported inside functions and used untyped: skipped, so that mypy gives the same answer whether or not
# they are installed (CI has none of the extras).
[[tool.mypy.overrides]]
module = [
  "faster_whisper.*", "ctranslate2.*", "whisperx.*", "nltk.*", "torch.*", "torchaudio.*", "transformers.*",
  "demucs.*", "f5_tts.*", "speechbrain.*",
]
ignore_missing_imports = true
follow_imports = "skip"
